plugins {
    id "com.github.node-gradle.node" version "7.1.0"
    id 'de.featjar.java-library'
}

dependencies {
    api 'de.featjar:gui'
}

node {
    // Whether to download and install a specific Node.js version or not
    // If false, it will use the globally installed Node.js
    // If true, it will download node using above parameters
    // Note that npm is bundled with Node.js
    download = true
    // Version of node to download and install (only used if download is true)
    // It will be unpacked in the workDir
    version = '20.20.2'
    // Version of Yarn to use
    // Any Yarn task first installs Yarn in the yarnWorkDir
    // It uses the specified version if defined and the latest version otherwise (by default)
    yarnVersion = '1.22.22'
}

tasks.register('yarnInstall', com.github.gradle.node.yarn.task.YarnTask) {
    workingDir = project.projectDir
    args = ['install']
}

tasks.register('yarnBuild', com.github.gradle.node.yarn.task.YarnTask) {
    dependsOn 'yarnInstall'
    workingDir = project.projectDir
    args = ['build']
}

task copyAppResources(type: Copy) {
    from fileTree('.') {
        include 'app/*'
        include 'css/*'
    }
    into "${buildDir}/resources/main/de/featjar/binary/gui/web"
}
javadoc.dependsOn(copyAppResources)
jar.dependsOn(copyAppResources)
copyAppResources.dependsOn('yarnBuild')

tasks.register('yarnFormat', com.github.gradle.node.yarn.task.YarnTask) {
    workingDir = project.projectDir
    args = ['format']
}
tasks.named('spotlessApply') {
    dependsOn 'yarnFormat'
}

tasks.register('yarnCleanBuild', com.github.gradle.node.yarn.task.YarnTask) {
    workingDir = project.projectDir
    args = ['clean:build']
}

tasks.named('clean') {
    dependsOn 'yarnClean'
}

tasks.register('yarnClean', com.github.gradle.node.yarn.task.YarnTask) {
    workingDir = project.projectDir
    args = ['clean']
}

tasks.register('yarnReset', com.github.gradle.node.yarn.task.YarnTask) {
    workingDir = project.projectDir
    args = ['reset']
}

license {
    ext {
        licence_url = 'https://github.com/FeatureIDE'
    }
}

